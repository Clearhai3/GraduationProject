{% extends "anime/base.html" %}
{% load static %}

{% block title %}{{ title }} · 数据大屏{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <p class="detail-sub">{{ sub }}</p>

    <div class="chart-detail">
        <div id="detailChart" class="chart-detail-plot"></div>
    </div>

    <!-- 预留: 图表说明区。内容还没想好，先占个坑 -->
    <div class="chart-notes"></div>

    <script src="{% static 'echarts.min.js' %}"></script>
    <script src="{% static 'js/chart-common.js' %}"></script>
    <script>
        const KIND = '{{ kind }}';
        const raw = JSON.parse('{{ chart_data|escapejs }}');

        // 单图页的皮肤: 比缩略图大一号 + 网格线打开
        const BIG = 12;

        const DETAIL = {
            ...BASE,
            textStyle: { 
                color: MUTED, 
                fontSize: BIG 
            },
            grid: { 
                left: 8,
                right: 24,
                top: 40,
                bottom: 8,
                containLabel: true
             }
        };

        const DETAIL_VALUE = {
            ...VALUE_AXIS,
            axisLabel: { 
                ...VALUE_AXIS.axisLabel, 
                fontSize: BIG 
            },
            // * 缩略图关掉的网格线，这里打开
            splitLine: {
                show: true,
                lineStyle: {
                    color: '#eef0f2',
                    width: 1
                }
            }
        };

        const DETAIL_CAT = {
            ...CAT_AXIS,
            axisLabel: {
                ...CAT_AXIS.axisLabel, 
                fontSize: BIG
            }
        };

        // labels + values 打成 [名, 值] 对，四种图都用得上
        const pairs = raw.labels.map((name, i) => [name, raw.values[i]]);

        const detail = echarts.init(document.getElementById('detailChart'));
        let option;

        if (KIND == 'bar') {
            // 柱状图: 评分分布 / 算法对比
            option = {
                ...DETAIL,
                xAxis: {
                    ...DETAIL_CAT,
                    data: raw.labels
                },
                yAxis: DETAIL_VALUE,
                series: [{
                    ...BAR,
                    barMaxWidth: 80,
                    label: {
                        ...BAR.label,
                        fontSize: BIG,
                        formatter: (p) => WAN(p.value),
                    },
                    data: raw.values,
                }]
            };

        } else if (KIND === 'hbar') {
            // 柱状图; 评分分布 / 算法对比
            option = {
                ...DETAIL,
                grid: {
                    ...DETAIL.grid, right: 56
                },
                xAxis: DETAIL_VALUE,
                yAxis: {
                    ...DETAIL_CAT,
                    data: pairs.map(p => p[0]),
                    inverse: true,
                    axisLabel: {
                        ...DETAIL_CAT.axisLabel,
                        width: 140,
                        overflow: 'truncate',
                        ellipsis: '...',
                    }
                },
                series: [{
                    ...HBAR,
                    label: {
                        ...HBAR.label,
                        fontSize: BIG
                    },
                    data: pairs.map(p => p[1]),
                }]
            };

        } else if (KIND === 'pie') {
            // 饼图: 用户活跃度分层
            option = {
                ...DETAIL,
                tooltip: {
                    ...BASE.tooltip,
                    trigger: 'item',
                    formatter: '{b}<br/>{c} 人 ({d}%)'
                },
                series: [{
                    type: 'pie',
                    radius: '64%',
                    center: ['50%', '50%'],
                    color: grayRamp(pairs.length),
                    data: pairs.map(p => ({
                        name: p[0],
                        value: p[1]
                    })),
                    itemStyle: {
                        borderColor: CSSVar('--bg', '#ffffff'),
                        borderWidth: 2,
                    },
                    label: {
                        color: MUTED,
                        fontSize: BIG,
                        formatter: '{b}\n{d}%',
                    },
                    labelLine: {
                        length: 12,
                        length2: 12
                    },
                }]
            };

        } else {
            // 折线图: 年度放送趋势
            const trendPairs = pairs
                .map(([year, cnt]) => [Number(year), cnt])
                .filter(p => !isNaN(p[0]));     // 筛掉"未知"

            option = {
                ...DETAIL,
                tooltip: {
                    ...BASE.tooltip,
                    trigger: 'axis',
                    axisPointer: {
                        snap: true
                    },
                    formatter: (params) => {
                        if (!params || !params.length) return '';
                        const [year, cnt] = params[0].value;
                        return `${Math.round(year)} 年 ${cnt} 部`;
                    }
                },
                xAxis: {
                    ...DETAIL_VALUE,
                    min: 1908,
                    max: 2030,
                    interval: 10,
                    axisLabel: {
                        ...DETAIL_VALUE.axisLabel,
                        formatter: (v) => v
                    },
                },
                yAxis: DETAIL_VALUE,
                series: [{
                    type: 'line',
                    data: trendPairs,
                    symbolSize: 6,
                    itemStyle: {
                        color: BAR_INK
                    },
                    lineStyle: {
                        color: BAR_INK,
                        width: 2
                    },
                }]
            };
        }

        detail.setOption(option);
        window.addEventListener("resize", () => detail.resize());
    </script>
{% endblock %}
