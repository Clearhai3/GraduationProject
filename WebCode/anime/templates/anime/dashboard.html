{% extends "anime/base.html" %}
{% load static %}

{% block title %}数据大屏{% endblock %}

{% block content %}
    <div class="chart-grid">
        <!-- 第一行: 三张小图 -->
         <div>
            <h2>评分分布</h2>
            <div id="scoreChart" class="chart-box"></div>
         </div>
         <div>
            <h2>用户活跃度分层</h2>
            <div id="activityChart" class="chart-box"></div>
         </div>
         <div>
            <h2>动漫类型分布</h2>
            <div id="typeChart" class="chart-box"></div>
         </div>

         <!-- 第二行: 长名字，占整行 -->
        <div class="chart-wide">
            <h2>评分 Top10</h2>
            <div id="topChart" class="chart-box"></div>
        </div>

          <!-- 第三行: 三张 -->
        <div>
            <h2>年度放送趋势 (1908-2026)</h2>
            <div id="trendChart" class="chart-box"></div>
        </div>
        <div>
            <h2>ItemCF 推荐效果</h2>
            <div id="itemcfChart" class="chart-box"></div>
        </div>
        <div>
            <h2>ALS 评分预测</h2>
            <div id="alsChart" class="chart-box"></div>
        </div>

        <!-- 第四、五行: 各占整行 -->
        <div class="chart-wide chart-wide-tall">
            <h2>热门动漫 Top20</h2>
            <div id="hotChart" class="chart-box"></div>
        </div>
        <div class="chart-wide">
            <h2>活跃用户 Top10</h2>
            <div id="activeUserChart" class="chart-box"></div>
        </div>
    </div>

    <script src="{% static 'echarts.min.js' %}"></script>
    <script>
        // 公共皮肤: 八张图共用
        // ECharts 是 JS，读不到 CSS 变量 —— 只能现场从 CSS 里"取"一次
        // 第二个参数是兜底: CSS 里没这个变量时用默认色，免得静默变黑
        const CSSVar = (name, fallback) => 
            getComputedStyle(document.documentElement)
                .getPropertyValue(name).trim() || fallback;

        const INK = CSSVar('--text',          '#1f2328');    // 文字色 (tooltip 用)
        const MUTED = CSSVar('--muted',       '#6b7280');    // 次要灰
        const AXIS = CSSVar('--axis',         '#9ca3af');    // 坐标轴
        const BAR_INK = CSSVar('--chart-ink', '#272727');    // 柱子/折线
        const AXIS_W = 1.5;
        const RAMP_FROM = '#e2e2e2';        // 最浅 (最少的那一档)
        const RAMP_TO = '#4a4a4a';          // 最深 (最多的那一档) 

        // 灰阶生成器: 给两个端点和档数，自动插值出中间色
        const grayRamp = (n, from = RAMP_FROM, to = RAMP_TO) => {
            if (n <= 1) return [to];
            const hex = (h) => parseInt(h, 16);
            const rgb = (h) => [hex(h.slice(1, 3)), hex(h.slice(3, 5)), hex(h.slice(5, 7))];
            const [r1, g1, b1] = rgb(from);
            const [r2, g2, b2] = rgb(to);
            return Array.from({ length: n }, (_, i) => {
                const t = i / (n - 1);      // 0 -> 1 均匀取 n 个点
                const mix = (a, b) => Math.round(a + (b - a) * t);
                return `rgb(${mix(r1, r2)}, ${mix(g1, g2)}, ${mix(b1, b2)})`;
            });
        };

        // 每个 setOption 前面加 ...BASE，就是"套上皮肤"
        const BASE = {
            animationDuration: 400,
            animationEasing: 'cubicOut',
            textStyle: { 
                color: MUTED, 
                fontSize: 12 
            },
            tooltip: {
                backgroundColor: CSSVar('--bg', '#ffffff'),
                borderColor: CSSVar('--border', '#e5e7eb'),
                textStyle: { color: INK, fontSize: 13 },
                confine: true
            }
        };

        // 大数字缩写成"万"
        const WAN = (v) => v >= 10000 ? (v / 10000).toFixed(1) + '万' : v;

        // 数值轴 (y 轴或横向图的 x 轴) : 删掉轴线和刻度，只留淡横线
        const VALUE_AXIS = {
            type: 'value',
            axisLine: { 
                show: true, 
                lineStyle: { color: AXIS, width: AXIS_W} 
            },
            axisTick: { 
                show: false 
            },
            axisLabel: { 
                color: MUTED, 
                formatter: WAN 
            },
            splitLine: { 
                show: false 
            }
        };

        // 类目轴 (动漫名/评分档) : 无轴线、无刻度、无竖线
        const CAT_AXIS = {
            type: 'category',
            axisLine: { 
                show: true, 
                lineStyle: { color: AXIS, width: AXIS_W} 
            },
            axisTick: { 
                show: false 
            },
            axisLabel: { 
                color: MUTED 
            },
            splitLine: { 
                show: false 
            },
        }

        // 柱子: 统一中性黑、圆角、不描边
        const BAR = {
            type: 'bar',
            itemStyle: { 
                color: BAR_INK, 
                borderRadius: [4, 4, 0, 0] 
            },
            label: { 
                show: true, 
                position: 'top', 
                color: MUTED, 
                fontSize: 12, 
                formatter: (p) => WAN(p.value) 
            }
        };

        // 横条图专用: 柱子向右长，数字要贴右边 (不是 top)
        const HBAR = {
            ...BAR,
            label: {
                ...BAR.label,
                position: 'right'
            }
        }

        // 从视图递过来的 JSON 字符串，这里已经是合法的 JS 对象了
        const scoreData = JSON.parse('{{ score_data|escapejs }}');

        const chart = echarts.init(document.getElementById('scoreChart'));
        chart.setOption({
            ...BASE,
            grid: { 
                left: 8, 
                right: 8, 
                top: 16, 
                bottom: 8, 
                containLabel: true 
            },
            xAxis: { 
                ...CAT_AXIS, 
                data: scoreData.labels 
            },
            yAxis: VALUE_AXIS, 
            series: [{
                ...BAR,
                data: scoreData.values                
            }]
        });

        // 图2 用户活跃度分层(饼图)
        const activityData = JSON.parse('{{ activity_data|escapejs }}');

        const pieData = activityData.labels.map((name, i) => ({
            name: name,
            value: activityData.values[i]
        }));

        const chart2 = echarts.init(document.getElementById('activityChart'));
        chart2.setOption({
            ...BASE,
            series: [{
                type: 'pie',
                radius: '62%',
                color: grayRamp(pieData.length),
                data: pieData,
                itemStyle: {
                    borderColor: CSSVar('--bg', '#ffffff'),
                    borderWidth: 2
                },
                label: {
                    color: MUTED,
                    fontSize: 12,
                    formatter: '{b}\n{d}%'
                },
                labelLine: {
                    length: 8,
                    length2: 8
                }
            }]
        });

        // 图3 动漫类型分布(横向条形图)
        const typeData = JSON.parse('{{ type_data|escapejs }}');

        const chart3 = echarts.init(document.getElementById('typeChart'));
        chart3.setOption({
            ...BASE,
            grid: { 
                left: 8, 
                right: 32, 
                top: 16, 
                bottom: 8,
                containLabel: true 
            },
            xAxis: VALUE_AXIS,
            yAxis: { 
                ...CAT_AXIS, 
                data: typeData.labels,
                inverse: true 
            },
            series: [{
                ...HBAR,
                data: typeData.values
            }]
        });

        // 图4 评分Top10(横向条形图 + 数值标签)
        const topData = JSON.parse('{{ top_data|escapejs }}');

        const chart4 = echarts.init(document.getElementById('topChart'));
        chart4.setOption({
            ...BASE,
            grid: { 
                left: 8,          // 左边留宽点，不然长名字被裁掉 
                right: 48,
                top: 16,
                bottom: 8,
                containLabel: true 
            },     
            xAxis: { 
                ...VALUE_AXIS, 
                min: 8, 
                max: 10 
            },
            yAxis: { 
                ...CAT_AXIS, 
                data: topData.labels, 
                inverse: true 
            },
            series: [{
                ...HBAR,
                data: topData.values,   
            }]
        });

        // 图5 热门动漫Top20(横向条形图，从0开始量)
        const hotData = JSON.parse('{{ hot_data|escapejs }}');

        const chart5 = echarts.init(document.getElementById('hotChart'));
        chart5.setOption({
            ...BASE,
            grid: {
                left: 8, 
                right: 48,
                top: 16,
                bottom: 8,
                containLabel: true
            },
            xAxis: VALUE_AXIS,
            yAxis: { 
                ...CAT_AXIS, 
                data: hotData.labels, 
                inverse: true
            },
            series: [{
                ...HBAR,
                data: hotData.values
            }]
        });

        // 图6 年度放送趋势(折线图，数值轴=真实时间距离)
        const trendData = JSON.parse('{{ trend_data|escapejs }}');

        // 拼成 [年份，数量] 坐标点; filter 筛掉"未知"(它不是年份)
        const trendPoints = trendData.labels
            .map((year, i) => [Number(year), trendData.values[i]])
            .filter(p => !isNaN(p[0]));     // 只筛选"未知", 2026 保留

        const chart6 = echarts.init(document.getElementById('trendChart'));
        chart6.setOption({
            ...BASE,   // 悬停时按 x 轴取点
            grid: {
                left: 8,
                right: 24,
                top: 16,
                bottom: 8,
                containLabel: true
            },
            tooltip: {
                ...BASE.tooltip,
                trigger: 'axis'
            },
            xAxis: { 
                ...VALUE_AXIS,
                min: 1908, 
                max: 2030 
            },
            yAxis: VALUE_AXIS,
            series: [{
                type: 'line',
                data: trendPoints,
                symbolSize: 6,
                itemStyle: {
                    color: BAR_INK
                },
                lineStyle: {
                    color: BAR_INK,
                    width: 2
                }
            }]
        });

        // 图7 活跃用户Top10(横向条形图，同图5写法)
        const activeUserData = JSON.parse('{{ active_users_data|escapejs }}');

        const chart7 = echarts.init(document.getElementById('activeUserChart'));
        chart7.setOption({
            ...BASE,
            grid: { 
                left: 8,
                right: 48,
                top: 16,
                bottom: 8,
                containLabel: true
            },
            xAxis: VALUE_AXIS,
            yAxis: {
                ...CAT_AXIS,
                data: activeUserData.labels,
                inverse: true
            },
            series: [{
                ...HBAR,
                data: activeUserData.values
            }]
        });

        // 图8 算法效果对比(拆两张，因为量纲不同)
        const algoData = JSON.parse('{{ algorithm_data|escapejs }}');

        // 8-a: ItemCF，单位 %
        const chart8a = echarts.init(document.getElementById('itemcfChart'));
        chart8a.setOption({
            ...BASE,
            grid: {
                left: 8,
                right: 8,
                top: 24,
                bottom: 8,
                containLabel: true
            },
            xAxis: {
                ...CAT_AXIS,  
                data: algoData.itemcf.labels 
            },
            yAxis: VALUE_AXIS,
            series: [{
                ...BAR,

                data: algoData.itemcf.values,
            }]
        });

        // 8-b: ALS，单位 RMSE 分数(越低越好)
        const chart8b = echarts.init(document.getElementById('alsChart'));
        chart8b.setOption({
            ...BASE,
            grid: { 
                left: 8,
                right: 8,
                top: 24,
                bottom: 8,
                containLabel: true
             },
            xAxis: { 
                ...CAT_AXIS, 
                data: algoData.als.labels 
            },
            yAxis: { 
                ...VALUE_AXIS, 
                min: 0
            },
            series: [{
                ...BAR,
                data: algoData.als.values,
            }]
        });

        // 窗口变化时，让所有图跟着重新量尺寸
        const allCharts = [chart, chart2, chart3, chart4, chart5, chart6, chart7, chart8a, chart8b]

        let resizeTimer = null;
        window.addEventListener("resize", function() {
            clearTimeout(resizeTimer);                  // 取消上一次还没跑的
            resizeTimer = setTimeout(function () {      // 等用户停手 200ms 再干活
                requestAnimationFrame(function () {
                    allCharts.forEach(c => c.resize());
                });
            }, 200);
        });
    </script>
{% endblock %}
