{% extends "anime/base.html" %}
{% load static %}

{% block title %}数据大屏{% endblock %}

{% block content %}
    <h1>📊 评分分布</h1>
    <!-- ECharts 的"画布": 必须有宽高, 不然图会缩成 0 高看不见 -->
    <div id="scoreChart" class="chart-box"></div>

    <h1>👥 用户活跃度分层</h1>
    <div id="activityChart" class="chart-box"></div>

    <h1>🎬 动漫类型分布</h1>
    <div id="typeChart" class="chart-box"></div>

    <h1>⭐ 评分 Top10</h1>
    <div id="topChart" class="chart-box"></div>

    <h1>🔥 热门动漫 Top20</h1>
    <div id="hotChart" class="chart-box chart-box-tall"></div>

    <h1>📈 年度放送趋势(1908-2026)</h1>
    <div id="trendChart" class="chart-box"></div>

    <h1>👑 活跃用户 Top10</h1>
    <div id="activeUserChart" class="chart-box"></div>

    <h1>🏆 算法效果对比</h1>
    <div class="chart-pair">
        <div id="itemcfChart"></div>
        <div id="alsChart"></div>
    </div>

    <script src="{% static 'echarts.min.js' %}"></script>
    <script>
        // 从视图递过来的 JSON 字符串，这里已经是合法的 JS 对象了
        const scoreData = JSON.parse('{{ score_data|escapejs }}');

        const chart = echarts.init(document.getElementById('scoreChart'));
        chart.setOption({
            tooltip: {},
            xAxis: { type: 'category', data: scoreData.labels },
            yAxis: { type: 'value' },
            series: [{
                type: 'bar',
                data: scoreData.values
            }]
        });

        // 图2 用户活跃度分层(饼图)
        const activityData = JSON.parse('{{ activity_data|escapejs }}');

        const pieData = activityData.labels.map((name, i) => ({
            name: name,
            value: activityData.values[i]
        }));

        const chart2 = echarts.init(document.getElementById('activityChart'));
        chart2.setOption({
            tooltip: {},
            series: [{
                type: 'pie',
                radius: '60%',
                data: pieData
            }]
        });

        // 图3 动漫类型分布(横向条形图)
        const typeData = JSON.parse('{{ type_data|escapejs }}');

        const chart3 = echarts.init(document.getElementById('typeChart'));
        chart3.setOption({
            tooltip: {},
            xAxis: { type: 'value' },
            yAxis: { type: 'category', data: typeData.labels, inverse: true },
            series: [{
                type: 'bar',
                data: typeData.values
            }]
        });

        // 图4 评分Top10(横向条形图 + 数值标签)
        const topData = JSON.parse('{{ top_data|escapejs }}');

        const chart4 = echarts.init(document.getElementById('topChart'));
        chart4.setOption({
            tooltip: {},
            grid: { left: 280, right: 60 },     // 左边留宽点，不然长名字被裁掉
            xAxis: { type: 'value', min: 8, max: 10 },
            yAxis: { type: 'category', data: topData.labels, inverse: true },
            series: [{
                type: 'bar',
                data: topData.values,
                label: { show: true, position: 'right' }    // 分数写在条的右边
            }]
        });

        // 图5 热门动漫Top20(横向条形图，从0开始量)
        const hotData = JSON.parse('{{ hot_data|escapejs }}');

        const chart5 = echarts.init(document.getElementById('hotChart'));
        chart5.setOption({
            tooltip: {},
            grid: {left: 300, right: 80},
            xAxis: { type: 'value' },
            yAxis: { type: 'category', data: hotData.labels, inverse: true},
            series: [{
                type: 'bar',
                data: hotData.values,
                label: { show: true, position: 'right' }
            }]
        });

        // 图6 年度放送趋势(折线图，数值轴=真实时间距离)
        const trendData = JSON.parse('{{ trend_data|escapejs }}');

        // 拼成 [年份，数量] 坐标点; filter 筛掉"未知"(它不是年份)
        const trendPoints = trendData.labels
            .map((year, i) => [Number(year), trendData.values[i]])
            .filter(p => !isNaN(p[0]));     // 只筛选"未知", 2026 保留

        const chart6 = echarts.init(document.getElementById('trendChart'));
        chart6.setOption({
            tooltip: { trigger: 'axis' },   // 悬停时按 x 轴取点
            xAxis: { type: 'value', min: 1908, max: 2030 },
            yAxis: { type: 'value' },
            series: [{
                type: 'line',
                data: trendPoints,
                symbolSize: 6
            }]
        });

        // 图7 活跃用户Top10(横向条形图，同图5写法)
        const activeUserData = JSON.parse('{{ active_users_data|escapejs }}');

        const chart7 = echarts.init(document.getElementById('activeUserChart'));
        chart7.setOption({
            tooltip: {},
            grid: { left: 200, right: 80},
            xAxis: { type: 'value' },
            yAxis: { type: 'category', data: activeUserData.labels, inverse: true },
            series: [{
                type: 'bar',
                data: activeUserData.values,
                label: { show: true, position: 'right' }
            }]
        });

        // 图8 算法效果对比(拆两张，因为量纲不同)
        const algoData = JSON.parse('{{ algorithm_data|escapejs }}');

        // 8-a: ItemCF，单位 %
        const chart8a = echarts.init(document.getElementById('itemcfChart'));
        chart8a.setOption({
            title: { text: 'ItemCF 推荐效果(%)', left: 'center' },
            tooltip: {},
            xAxis: { type: 'category', data: algoData.itemcf.labels },
            yAxis: { type: 'value' },
            series: [{
                type: 'bar',
                data: algoData.itemcf.values,
                label: { show: true, position: 'top' }
            }]
        });

        // 8-b: ALS，单位 RMSE 分数(越低越好)
        const chart8b = echarts.init(document.getElementById('alsChart'));
        chart8b.setOption({
            title: { text: 'ALS 评分预测(RMSE，越低越好)', left: 'center' },
            tooltip: {},
            xAxis: { type: 'category', data: algoData.als.labels },
            yAxis: { type: 'value', min: 0},
            series: [{
                type: 'bar',
                data: algoData.als.values,
                label: { show: true, position: 'top' }
            }]
        });

        // 窗口变化时，让所有图跟着重新量尺寸
        const allCharts = [chart, chart2, chart3, chart4, chart5, chart6, chart7, chart8a, chart8b]

        let resizeTimer = null;
        window.addEventListener("resize", function() {
            clearTimeout(resizeTimer);                  // 取消上一次还没跑的
            resizeTimer = setTimeout(function () {      // 等用户停手 200ms 再干活
                allCharts.forEach(c => c.resize());
            }, 200);
        });
    </script>
{% endblock %}
