{% extends "anime/base.html" %}

{% block title %}登录 - Elarea AnimeProject{% endblock %}

{% block content %}
    <h2>登录</h2>

    {% if error %}
        <p style="color: #c53030;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>用户名</label>
            <input type="text" name="username" required>
        </p>
        <p>
            <label>密码</label>
            <input type="password" name="password" required>
        </p>
        <button type="submit">登录</button>
    </form>

    <p>还没有账号？<a href="{% url 'user_register' %}">去注册</a></p>
{% endblock %}
