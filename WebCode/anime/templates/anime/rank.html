{% extends "anime/base.html" %}

{% block title %}排行榜{% endblock %}

{% block content %}
    <h1>🏆 评分排行榜 (Top 20)</h1>
    <table border="1">
        <tr>
            <th>排名</th>
            <th>名称</th>
            <th>评分</th>
        </tr>
        {% for a in animes %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td><a href="/anime/{{ a.subject_id }}">{{ a.name }}</a></td>
            <td>{{ a.rating }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
